<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;line-height:1.3}
.blatt{max-width:1080px;margin:0 auto;padding:16px}

table.mp td.zeit{font-weight:700;font-size:.7rem}
table.mp tr td{height:92px}
@media print{@page{size:A4 landscape;margin:9mm}.leiste{display:none}.blatt{max-width:none;padding:0}}
