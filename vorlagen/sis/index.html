<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIS®-Bogen (ambulant) – Druckansicht | Dokuna</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://dokuna.de/vorlagen/">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#fbfbfd;color:#1d1d1f}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.leiste{padding:0 0 14px;display:flex;gap:10px;align-items:center}
.leiste button,.leiste a{background:#0e8477;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.leiste a{background:#fff;color:#0e8477;border:1.5px solid #0e8477}
.leiste .status{font-size:.8rem;color:#6e6e73}
#blatt{width:100%;border:1px solid #e8e8ed;background:#fff}
#blatt canvas{width:100%;height:auto;display:block}
.quelle{font-size:.7rem;color:#6e6e73;padding:8px 0 24px}
.quelle a{color:#0e8477}
@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.wrap{max-width:none;padding:0}.leiste,.quelle{display:none}#blatt{border:0}#blatt canvas{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="leiste"><button onclick="window.print()">Drucken</button><a href="/vorlagen/">← Zurück</a><span class="status" id="status">Bogen wird geladen …</span></div>
<div id="blatt"></div>
<p class="quelle">SIS® – Strukturierte Informationssammlung (ambulant), unveränderte Originalseite · Konzept: Beikirch/Roes · Nutzungsrechte: Bundesministerium für Gesundheit · Quelle: <a href="https://www.ein-step.de/schulungsunterlagen" rel="noopener">ein-step.de</a></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const url = 'https://cdn.prod.website-files.com/66867cfecea6f93a2305684f/683ed9751fb90c710c9fd8bd_Anlage%201a_SIS_Erla%CC%88uterungen_ambulant_V3.0.pdf';
pdfjsLib.getDocument(url).promise.then(pdf => pdf.getPage(1)).then(page => {
  const scale = 2.2;
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  document.getElementById('blatt').appendChild(canvas);
  return page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
}).then(() => {
  document.getElementById('status').textContent = '';
  if (new URLSearchParams(location.search).has('drucken')) setTimeout(() => window.print(), 400);
}).catch(e => { document.getElementById('status').textContent = 'Fehler beim Laden – bitte Original bei ein-step.de öffnen.'; });
</script>
</body>
</html>
